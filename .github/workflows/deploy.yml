name: Deploy Personal AI OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository download
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Extract the uploaded ZIP
      - name: Extract application ZIP
        run: |
          set -e

          rm -rf app

          mkdir -p app

          unzip -o personal-ai-os-build-01.zip -d app

          echo "ZIP extracted successfully."

          echo "Searching for package.json..."

          PACKAGE_FILE=$(find app -name package.json -type f | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")

          echo "Application directory:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 4. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          npm install

      # 5. TypeScript check + Vite production build
      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          npm run build

      # 6. Verify dist folder
      - name: Verify production build
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Production build verified successfully."

      # 7. Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 8. Upload built application
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  # 9. Deploy
  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
